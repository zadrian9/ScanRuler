name: Sync Upstream and Backup Metadata

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync main and tags with CNCKitchen/ScanRuler
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/CNCKitchen/ScanRuler.git || git remote set-url upstream https://github.com/CNCKitchen/ScanRuler.git
          git fetch upstream main --tags
          git checkout main
          git merge --no-edit upstream/main
          git push origin main --tags

  backup-metadata:
    runs-on: ubuntu-latest
    needs: sync
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export releases, issues, and PRs to backup branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin backup >/dev/null 2>&1; then
            git fetch origin backup
            git checkout -B backup origin/backup
          else
            git checkout --orphan backup
            git rm -rf . || true
          fi
          mkdir -p backup
          gh api "repos/CNCKitchen/ScanRuler/releases" --paginate > backup/releases.json
          gh api "repos/CNCKitchen/ScanRuler/issues?state=all" --paginate > backup/issues-and-prs.json
          gh api "repos/CNCKitchen/ScanRuler/issues/comments" --paginate > backup/issue-comments.json
          gh api "repos/CNCKitchen/ScanRuler/pulls/comments" --paginate > backup/pr-review-comments.json
          git add backup/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update upstream metadata backup"
            git push origin backup
          fi
